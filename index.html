<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>药理学探究式学习智能体</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(145deg, #0f172a 0%, #1a365d 100%);
            color: #e2e8f0;
            min-height: 100vh;
            scroll-behavior: smooth;
        }
        .navbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 24px; background: rgba(15,23,42,0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,181,216,0.2);
            position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 20px; font-weight: 700; color: #00b5d8; }
        .nav-links a { color: #94a3b8; text-decoration: none; margin-left: 24px; font-size: 14px; }
        .nav-links a:hover { color: #00b5d8; }
        .hero {
            text-align: center; padding: 80px 20px 40px; max-width: 800px; margin: 0 auto;
        }
        .hero h1 { font-size: 36px; font-weight: 700; color: #fff; margin-bottom: 16px; }
        .hero h1 .accent { color: #00b5d8; }
        .hero .subtitle { font-size: 18px; color: #94a3b8; margin-bottom: 24px; }
        .hero .desc { font-size: 15px; color: #cbd5e1; margin-bottom: 40px; line-height: 1.6; }
        .hero .cta-btn {
            display: inline-block; padding: 14px 36px; background: #00b5d8; color: #fff;
            border-radius: 50px; text-decoration: none; font-weight: 600; font-size: 16px;
            cursor: pointer; border: none;
        }
        .chat-section { max-width: 800px; margin: 0 auto 60px; padding: 0 20px; }
        .chat-card {
            background: rgba(255,255,255,0.03); backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 24px;
            overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .chat-header {
            background: rgba(0,181,216,0.1); padding: 20px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex; align-items: center; gap: 10px;
        }
        .chat-header .dot { width: 10px; height: 10px; border-radius: 50%; background: #00b5d8; box-shadow: 0 0 10px #00b5d8; }
        .chat-header span { font-size: 16px; color: #00b5d8; font-weight: 500; }
        #chat-messages {
            height: 400px; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .message {
            max-width: 80%; padding: 12px 16px; border-radius: 16px; line-height: 1.5; font-size: 14px;
        }
        .message.user { align-self: flex-end; background: #00b5d8; color: #fff; }
        .message.bot { align-self: flex-start; background: rgba(255,255,255,0.08); color: #e2e8f0; }
        .chat-input-area {
            display: flex; gap: 10px; padding: 16px 24px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .chat-input-area input {
            flex: 1; padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08); color: white; font-size: 14px; outline: none;
        }
        .chat-input-area button {
            padding: 12px 24px; background: #00b5d8; color: #fff; border: none;
            border-radius: 12px; font-weight: 600; cursor: pointer;
        }
        .footer { text-align: center; padding: 20px; color: #475569; font-size: 12px; border-top: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">🧬 PharmAgent</div>
        <div class="nav-links">
            <a href="#">首页</a>
            <a href="#">探究工作台</a>
            <a href="#">知识图谱</a>
            <a href="#">学习记录</a>
        </div>
    </nav>

    <section class="hero">
        <h1>药理学<span class="accent">探究式学习</span>智能体</h1>
        <p class="subtitle">从靶点到临床，模拟真实科研思维</p>
        <p class="desc">本智能体深度融入《药理学》课程教学目标与专属知识库，通过四步探究法引导你理解药物作用机制与临床应用。</p>
        <a href="#chat-section" class="cta-btn">开始探究</a>
    </section>

    <section class="chat-section" id="chat-section">
        <div class="chat-card">
            <div class="chat-header"><div class="dot"></div><span>药理学智能体 · 课程专属问答</span></div>
            <div id="chat-messages"></div>
            <div class="chat-input-area">
                <input id="user-input" type="text" placeholder="请输入药理学问题，如：卡托普利的作用机制？" />
                <button onclick="sendMessage()">发送</button>
            </div>
        </div>
    </section>

    <div class="footer">© 2025 药理学课程智能体 · 基于 Coze API</div>

    <script>
        // ========== 配置区域：替换成你自己的 ==========
        const BOT_ID = '7640289309333143602';   // 你的 Bot ID
        const API_KEY = 'pat_U5jyh0oN14sknm0xUrKlfx0grXv81AUsxcMxckuFrfwGG1SM7gUlP3c3LBPURy0A';    // 你的个人访问令牌
        const API_URL = 'https://api.coze.cn/open_api/v2/chat';
        // =============================================

        const messagesDiv = document.getElementById('chat-messages');
        const input = document.getElementById('user-input');

        // 回车发送
        input.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;
            addMessage('user', text);
            input.value = '';
            const loadingId = addMessage('bot', '思考中...');

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        bot_id: BOT_ID,
                        user_id: 'student_001',
                        stream: false,
                        additional_messages: [
                            { role: 'user', content: text, content_type: 'text' }
                        ]
                    })
                });
                const data = await res.json();
                const reply = data?.messages?.[0]?.content || '抱歉，没有收到回复。';
                updateMessage(loadingId, reply);
            } catch (err) {
                updateMessage(loadingId, '网络错误，请稍后再试。');
            }
        }

        function addMessage(role, text) {
            const msg = document.createElement('div');
            msg.className = `message ${role}`;
            msg.textContent = text;
            messagesDiv.appendChild(msg);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return msg;
        }

        function updateMessage(el, text) {
            el.textContent = text;
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
    </script>
</body>
</html>
